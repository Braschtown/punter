name: Snapshot prices

# Brisbane is UTC+10 all year. Every 5 minutes from 10:00 to 23:59 Brisbane (00:00-13:59 UTC),
# then hourly overnight to catch early prices for the next day. Runs can be late or skipped;
# every capture stores its real timestamp and minutes to jump.
# GitHub runs schedules as the last person to commit this file, so commit it from a git
# identity linked to a GitHub account, or the schedule silently never fires.
on:
  schedule:
    - cron: '*/5 0-13 * * *'
    - cron: '7 14-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
        env:
          LADBROKES_FROM: ${{ secrets.LADBROKES_FROM || vars.LADBROKES_FROM }}
      - run: bash scripts/commit-data.sh data "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
        if: always()
