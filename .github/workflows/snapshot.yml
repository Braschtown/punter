name: Snapshot prices

# Manual runs only. Timed collection runs in collect.yml, because GitHub dropped most runs of
# this workflow's 5-minute cron schedule.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
        env:
          LADBROKES_FROM: ${{ secrets.LADBROKES_FROM || vars.LADBROKES_FROM }}
      - run: bash scripts/commit-data.sh data "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
        if: always()
